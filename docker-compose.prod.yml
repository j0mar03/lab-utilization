services:
  # ── PHP-FPM app (Laravel) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lab-utilization-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/entrypoint.sh:/usr/local/bin/entrypoint.sh
      - composer-cache:/tmp/composer-cache
    environment:
      - TZ=Asia/Manila
      - HOME=/tmp
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://lab.itechportfolio.xyz
      # Connect to existing facultyportfolio-db on VPS
      - DB_CONNECTION=mysql
      - DB_HOST=facultyportfolio-db
      - DB_PORT=3306
      - DB_DATABASE=lab_utilization
      - DB_USERNAME=lab_user
      - DB_PASSWORD=LabSystem2026!Secure
      # Telegram Bot Notifications
      - TELEGRAM_BOT_TOKEN=8375004820:AAFEqfIxsR5gqbthXSrq6_-76ZpB57nCF_M
      - TELEGRAM_DEFAULT_CHAT_ID=-1003201567471
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - facultyportfolio_default

  # ── Nginx web server ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: lab-utilization-web
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - app
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - facultyportfolio_default

  # ── Automated Scheduler (Cron for Overdue Telegram Alerts) ─────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lab-utilization-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - TZ=Asia/Manila
      - HOME=/tmp
      - APP_ENV=production
      - APP_URL=https://lab.itechportfolio.xyz
      - DB_CONNECTION=mysql
      - DB_HOST=facultyportfolio-db
      - DB_PORT=3306
      - DB_DATABASE=lab_utilization
      - DB_USERNAME=lab_user
      - DB_PASSWORD=LabSystem2026!Secure
      - TELEGRAM_BOT_TOKEN=8375004820:AAFEqfIxsR5gqbthXSrq6_-76ZpB57nCF_M
      - TELEGRAM_DEFAULT_CHAT_ID=-1003201567471
    dns:
      - 8.8.8.8
      - 1.1.1.1
    entrypoint: ["sh", "-c", "sleep 15; while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    depends_on:
      - app
    networks:
      - facultyportfolio_default

volumes:
  composer-cache:

networks:
  facultyportfolio_default:
    external: true
